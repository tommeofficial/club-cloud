<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Club Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one fixed app surface (rotated to landscape on portrait phones) holding the zoom tabs and the
   hardware stage, which is drawn in the reference photo's pixel space and scaled to fit. */
html, body { overscroll-behavior: none; }
:root {
  --bg: #050506;
  --chrome: #0d0d0f;
  --ink: #d6d7da;
  --ink-dim: #7d808a;
  --accent: #ff8a1c;
  --blue: #2f8cff;
  --label: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --ui: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #16171a 0%, #060607 70%); }
#tabs { position: absolute; display: flex; gap: 4px; z-index: 5; align-items: center; }
#tabs.h { left: 0; right: 0; top: 0; height: 36px; padding: 0 10px; justify-content: center; }
#tabs.v { left: 0; top: 0; bottom: 0; width: 64px; flex-direction: column; justify-content: center; padding: 8px 0; }
#tabs .brand { font: 700 13px/1 var(--label); letter-spacing: 2px; color: #e9eaec; margin-right: auto; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
#tabs.v .brand { margin: 0 0 auto; font-size: 10px; letter-spacing: 1px; flex-direction: column; text-align: center; gap: 2px; }
#tabs .grp { display: flex; gap: 3px; background: #121315; border: 1px solid #24262a; border-radius: 8px; padding: 3px; }
#tabs.v .grp { flex-direction: column; }
#tabs button { font: 600 12px/1 var(--label); letter-spacing: 1px; color: #9da1aa; background: transparent; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; min-height: 28px; }
#tabs.v button { padding: 8px 4px; font-size: 11px; width: 54px; }
#tabs button.on { background: #2b2e34; color: #fff; }
#tabs button[data-mode].on { background: #163a5c; color: #8fe9ff; }
#tabs.compact { justify-content: flex-start; padding: 0 4px; gap: 4px; }
#tabs.compact .brand { display: none; }
#tabs.compact button { padding: 7px 7px; font-size: 11px; letter-spacing: .5px; }
#tabs.compact .tools { margin-left: auto; }
#tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#tabs .tools { margin-left: auto; display: flex; gap: 3px; }
#tabs.v .tools { margin: auto 0 0; flex-direction: column; }
#view { position: absolute; overflow: hidden; touch-action: none; }
#stage { position: absolute; left: 0; top: 0; width: 1840px; height: 964px; transform-origin: 0 0; font-family: var(--label); }
#stage.anim { transition: transform .28s cubic-bezier(.2,.7,.2,1); }
#stage > svg { position: absolute; left: 0; top: 0; }
#stage text { font-family: var(--label); font-weight: 600; letter-spacing: .3px; }
.c { position: absolute; touch-action: none; cursor: pointer; }

/* ---------- knobs */
.k { border-radius: 50%; cursor: grab; }
.k .body { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #303033 0, #19191b 60%, #0b0b0c 100%); box-shadow: 0 5px 7px rgba(0,0,0,.8), 0 0 0 1px #040404, inset 0 1px 1px rgba(255,255,255,.14); }
.k .rot { position: absolute; inset: 0; }
.k .knurl { position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(#2c2c2f 0 5deg, #0e0e10 5deg 10deg); -webkit-mask: radial-gradient(circle, transparent 69%, #000 70%); mask: radial-gradient(circle, transparent 69%, #000 70%); }
.k .cap { position: absolute; inset: 17%; border-radius: 50%; background: radial-gradient(circle at 45% 28%, #57575b 0, #262628 52%, #141415 100%); box-shadow: 0 0 0 1px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.16); }
.k.trim .cap { background: radial-gradient(circle at 45% 28%, #f2f2f4 0, #b9babe 45%, #6c6d71 100%); }
.k.mic .cap { background: conic-gradient(from 20deg, #9b9ca0, #e3e4e6, #77787c, #d7d8db, #85868a, #e7e8ea, #9b9ca0); }
.k .ind { position: absolute; left: calc(50% - 1.6px); top: 5%; width: 3.2px; height: 40%; border-radius: 2px; background: #f7f7f7; box-shadow: 0 0 3px rgba(255,255,255,.35); }
.k.trim .ind { background: #111; box-shadow: none; }
.k.color::before { content: ''; position: absolute; inset: -14%; border-radius: 50%; background: radial-gradient(circle, #0a0a0b 66%, #2a2a2d 68%, #111 74%); box-shadow: 0 0 0 1px #000; }
.k.enc .cap { background: radial-gradient(circle at 45% 30%, #3e3e42 0, #1a1a1c 70%); }
.k.enc .knurl { background: repeating-conic-gradient(#3a3a3e 0 4deg, #101012 4deg 8deg); -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%); mask: radial-gradient(circle, transparent 55%, #000 56%); }
.k.rotary::before { content: ''; position: absolute; inset: -26%; border-radius: 50%; background: radial-gradient(circle, #050505 60%, #2d2e31 63%, #151517 72%, #060606 76%); box-shadow: 0 0 0 1px #000, inset 0 2px 4px rgba(255,255,255,.07); }

/* ---------- buttons: .lamp opacity follows data-led (0 off, d dim, 1 on, b blink) */
.b { display: flex; align-items: center; justify-content: center; font: 700 11px/1 var(--label); letter-spacing: .4px; color: #d8d8d8; transition: transform .05s; }
.b .lamp { position: absolute; inset: 0; border-radius: inherit; opacity: .12; transition: opacity .06s; pointer-events: none; }
.b[data-led="d"] .lamp { opacity: .38; }
.b[data-led="1"] .lamp, .b[data-led="b"] .lamp { opacity: 1; }
#stage.bp .b[data-led="b"] .lamp { opacity: .18; }
.b.dn { transform: translateY(1px) scale(.965); filter: brightness(1.25); }
.b > span { position: relative; z-index: 1; pointer-events: none; }

.b.round { border-radius: 50%; background: radial-gradient(circle at 50% 35%, #2e2e31 0, #151517 70%); box-shadow: 0 0 0 3px #070707, 0 0 0 4.5px #2a2a2d, 0 4px 6px 3px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.14); }
.b.round .lamp { inset: 34%; border-radius: 50%; background: radial-gradient(circle, var(--lc, #ff2828) 0, var(--lc, #ff2828) 45%, transparent 75%); box-shadow: 0 0 6px 2px var(--lc, #ff2828); }
.b.round.plain .lamp { display: none; }
.b.round.arrow span { font-size: 9px; color: #bbb; }
.b.inout { border-radius: 50%; background: radial-gradient(circle at 50% 38%, #7a4207 0, #4a2603 70%); box-shadow: 0 0 0 3px #0a0a0a, 0 0 0 5px #2c2c2f, 0 4px 8px 4px rgba(0,0,0,.65); }
.b.inout .lamp { background: radial-gradient(circle at 50% 36%, #ffcb6b 0, #ff9a14 45%, #e06f00 100%); box-shadow: 0 0 14px 3px rgba(255,140,20,.55); }
.b.rect { border-radius: 4px; background: linear-gradient(#26262a, #141416); box-shadow: 0 0 0 2px #070707, 0 0 0 3.5px #2b2b2e, 0 3px 6px 2px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1); }
.b.rev { background: linear-gradient(#5a0c12, #3a060a); }
.b.rev .lamp { border-radius: 3px; background: linear-gradient(#ff4b55, #d01622); box-shadow: 0 0 12px rgba(255,40,50,.6); }
.b.rev span { color: #fff; }
.b.vinyl .lamp { border-radius: 3px; border: 2px solid #3b7bff; box-shadow: 0 0 9px #2a6bff, inset 0 0 9px #2a6bff; }
.b.vinyl span { color: #5f97ff; }
.b.sync .lamp { border-radius: 3px; border: 2px solid #f4f4f4; box-shadow: 0 0 8px rgba(255,255,255,.7), inset 0 0 6px rgba(255,255,255,.5); }
.b.master .lamp { border-radius: 3px; border: 2px solid #ff9a14; box-shadow: 0 0 9px #ff8a00, inset 0 0 7px #ff8a00; }
.b.sync span, .b.master span { font-size: 7.5px; }
.b.master span { color: #ffab3d; }
.b.shift span { font-size: 9px; padding: 2px 4px; border: 1.5px solid #bfbfbf; border-radius: 2px; color: #d6d6d6; }
.b.shift .lamp { border-radius: 4px; box-shadow: inset 0 0 10px rgba(255,255,255,.5); }
.b.big { border-radius: 50%; background: radial-gradient(circle at 50% 40%, #b7b8bc 0, #77787d 36%, #3b3c40 70%, #222326 100%); box-shadow: 0 0 0 6px #121214, 0 0 0 9px var(--ring-off), 0 6px 12px 7px rgba(0,0,0,.65), inset 0 2px 3px rgba(255,255,255,.35); font-size: 15px; color: #161616; }
.b.big::after { content: ''; position: absolute; inset: 8%; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.07) 0 2deg, rgba(0,0,0,.05) 2deg 4deg); pointer-events: none; }
.b.big .lamp { inset: -9px; border: 5px solid var(--ring); box-shadow: 0 0 14px 2px var(--ring), inset 0 0 8px var(--ring); background: none; border-radius: 50%; }
.b.big.cue { --ring: #ff8a14; --ring-off: #4b2a08; }
.b.big.play { --ring: #2ee04a; --ring-off: #0d3a16; }
.b.big span { color: #1e1e1e; font-size: 15px; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
.b.pm { border-radius: 3px; background: #0b0b0c; box-shadow: 0 0 0 1px #000; }
.b.pm .lamp { border-radius: 3px; border: 2px solid var(--lc); box-shadow: 0 0 6px var(--lc); }
.b.pm span { font-size: 10px; color: var(--lc); }
.b.pad { border-radius: 4px; background: linear-gradient(#1c1c1f, #121214); box-shadow: 0 0 0 1px #000, 0 3px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
.b.pad .lamp { border-radius: 4px; border: 3.5px solid var(--pc, #444); box-shadow: 0 0 9px var(--pc, #444), inset 0 0 6px var(--pc, #444); }
.b.pad.dn .lamp { opacity: 1; background: color-mix(in srgb, var(--pc, #444) 45%, transparent); }
.b.mcue { border-radius: 3px; background: #4a2604; box-shadow: 0 0 0 1.5px #000, 0 3px 5px rgba(0,0,0,.6); }
.b.mcue .lamp { border-radius: 3px; background: linear-gradient(#ffb546, #ff8a10); box-shadow: 0 0 10px rgba(255,140,20,.6); }
.b.mcue span { color: #2a1500; font-size: 10.5px; }
.b.mcue[data-led="0"] span, .b.mcue[data-led="d"] span { color: #ffb24a; }
.b.cfx { border-radius: 3px; background: linear-gradient(#232326, #121214); box-shadow: 0 0 0 1px #000, 0 0 0 2.5px #3a3a3e; }
.b.cfx .lamp { border-radius: 3px; border: 1.5px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,.75), inset 0 0 6px rgba(255,255,255,.35); }
.b.cfx span { font-size: 7.5px; text-align: center; line-height: .95; color: #e8e8e8; }
.b.tap { border-radius: 50%; background: radial-gradient(circle at 50% 38%, #1f2a20 0, #0c120d 70%); box-shadow: 0 0 0 3px #090909, 0 0 0 5px #2b2b2e, 0 4px 6px 3px rgba(0,0,0,.6); }
.b.tap .lamp { border-radius: 50%; border: 3px solid #2ee04a; box-shadow: 0 0 10px #2ee04a, inset 0 0 8px rgba(46,224,74,.6); }
.b.tap span { color: #4cf06a; font-size: 12px; }
.b.fxon { border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1d2b52 0, #0b1229 70%); box-shadow: 0 0 0 4px #0b0b0c, 0 0 0 7px #2c2c30, 0 5px 10px 5px rgba(0,0,0,.6); }
.b.fxon .lamp { border-radius: 50%; background: radial-gradient(circle at 50% 42%, #c7dcff 0, #5d97ff 40%, #2457e6 100%); box-shadow: 0 0 18px 4px rgba(70,130,255,.65); }
.b.beat span { font-size: 9px; color: #ddd; }
.b.dark span { font-size: 9px; color: #c9c9c9; text-align: center; line-height: 1; }
.b.load span { font-size: 12px; }
.b.load .lamp { border-radius: 4px; box-shadow: inset 0 0 0 1.5px #fff, 0 0 8px rgba(255,255,255,.6); }
.b.pill { border-radius: 50%; background: radial-gradient(circle at 50% 30%, #b9babd 0, #6c6d72 45%, #2d2e32 100%); box-shadow: 0 2px 3px rgba(0,0,0,.8), inset 0 1px 1px rgba(255,255,255,.5); }
.b.pill span { font-size: 9px; color: #111; letter-spacing: -1px; }
.b.auto { border-radius: 2px; background: transparent; box-shadow: none; }
.b.auto span { font-size: 7.5px; border: 1px solid #c9c9c9; padding: 1px 3px; border-radius: 2px; }
.b.auto .lamp { border-radius: 2px; background: rgba(255,255,255,.85); }
.b.auto[data-led="1"] span { color: #111; border-color: #fff; }

/* ---------- faders */
.f .slot { position: absolute; background: #050505; border-radius: 3px; box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06); }
.f .cap { position: absolute; border-radius: 3px; background: linear-gradient(#3b3b3f, #161618 45%, #0b0b0c 55%, #2a2a2d); box-shadow: 0 4px 6px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.18); cursor: grab; }
.f .cap::after { content: ''; position: absolute; background: #f2f2f2; box-shadow: 0 0 3px rgba(255,255,255,.6); }
.f.v .cap::after { left: 8%; right: 8%; top: calc(50% - 1px); height: 2px; }
.f.h .cap::after { top: 10%; bottom: 10%; left: calc(50% - 1.5px); width: 3px; }
.f.h .cap { background: linear-gradient(90deg, #2e2e31, #0d0d0e 30%, #1b1b1d 50%, #0d0d0e 70%, #2e2e31); }
.f.tempo .cap { background: linear-gradient(#7d7e83, #3c3d41 30%, #1c1c1f 48%, #121214 52%, #3a3b3f 70%, #77787d); }
.f.tempo .cap::after { height: 3px; top: calc(50% - 1.5px); }

/* ---------- switches */
.sw { border-radius: 4px; background: linear-gradient(#0a0a0a, #151517); box-shadow: inset 0 1px 3px #000, 0 0 0 1.5px #2a2a2d, 0 1px 0 rgba(255,255,255,.05); }
.sw .lever { position: absolute; top: 12%; bottom: 12%; width: 34%; border-radius: 2px; background: linear-gradient(90deg, #3c3c40, #8a8b90 45%, #2c2c30); box-shadow: 0 1px 2px rgba(0,0,0,.8); transition: left .08s; }

canvas.cv { position: absolute; pointer-events: none; }
.jog { border-radius: 50%; cursor: grab; }

/* ---------- top screens */
.scr { position: absolute; border-radius: 3px; overflow: hidden; background: #05070a; box-shadow: 0 0 0 1px #000, inset 0 0 0 1px #12161c; }
#cscreen { font-family: var(--ui); color: #e6e8eb; display: flex; flex-direction: column; touch-action: pan-y; }
#cscreen .hd { display: flex; align-items: stretch; height: 19px; background: #0b0e13; border-bottom: 1px solid #1a202a; flex: none; }
#cscreen .hd button { all: unset; cursor: pointer; font: 600 10px/19px var(--ui); letter-spacing: .8px; color: #5d8fe6; padding: 0 9px; border-right: 1px solid #161b23; }
#cscreen .hd button.on { color: #fff; background: #1a2230; }
#cscreen .hd .cnt { margin-left: auto; font: 500 9.5px/19px var(--ui); color: #6f7681; padding: 0 8px; white-space: nowrap; }
#cscreen .bd { flex: 1; display: grid; grid-template-columns: 1fr 150px; min-height: 0; }
#cslist { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: thin; scrollbar-color: #2b3340 transparent; min-width: 0; }
#cslist .row { display: grid; grid-template-columns: 18px 1fr 36px 26px 40px; align-items: center; gap: 4px; height: 20px; padding: 0 5px; border-bottom: 1px solid #0e1218; font: 500 10.5px/1 var(--ui); cursor: pointer; }
#cslist .row .ti { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#cslist .row .ti small { color: #747c88; margin-left: 5px; font-size: 9.5px; }
#cslist .row .num, #cslist .row .tm { color: #6c7480; font-variant-numeric: tabular-nums; font-size: 9.5px; }
#cslist .row .bpm { color: #ffb24a; font-variant-numeric: tabular-nums; text-align: right; font-size: 10px; }
#cslist .row .key { color: #7fd0ff; font-size: 9.5px; text-align: center; }
#cslist .row.sel { background: linear-gradient(90deg, #2556b8, #183c86); }
#cslist .row.sel .num, #cslist .row.sel .tm, #cslist .row.sel small { color: #c9d8ff; }
#cslist .row.ld1 .num::before { content: '1'; color: #ff9a1a; }
#cslist .row .tag { color: #ffd21c; }
#cslist .empty, .mlist .empty { padding: 14px 10px; font-size: 11px; color: #8a919c; line-height: 1.45; }
#cslist .empty b, .mlist .empty b { color: #fff; }
#csfx { border-left: 1px solid #1a202a; display: flex; flex-direction: column; gap: 3px; padding: 4px 5px; font-family: var(--ui); }
#csfx .t { font: 600 8px/1 var(--ui); letter-spacing: 1px; color: #7f8794; text-align: center; }
#csfx .nm { font: 700 12px/18px var(--ui); text-align: center; border: 1.5px solid #2f7bff; color: #8fb8ff; border-radius: 2px; letter-spacing: .5px; }
#csfx .nm.on { background: #2f7bff; color: #fff; }
#csfx .box { border: 1px solid #2a313c; border-radius: 2px; padding: 3px 5px; display: grid; grid-template-columns: 1fr auto; row-gap: 1px; font: 600 11px/1.15 var(--ui); font-variant-numeric: tabular-nums; }
#csfx .box i { font-style: normal; font: 500 8px/1.6 var(--ui); color: #8890a0; letter-spacing: .5px; }
#csfx .box .src { color: #ffb24a; }
#csfx .cfx { font: 600 9px/1 var(--ui); color: #c8ccd3; text-align: center; letter-spacing: .5px; margin-top: auto; }
#csfx .cfx b { color: #fff; }

/* ---------- value bubble */
#bubble { position: absolute; z-index: 30; transform: translate(-50%, -100%); pointer-events: none; background: rgba(12,13,16,.94); border: 1px solid #3a3d44; border-radius: 12px; padding: 8px 14px 10px; min-width: 116px; text-align: center; box-shadow: 0 8px 26px rgba(0,0,0,.6); }
#bubble .bl { font: 600 11px/1 var(--label); letter-spacing: 1.5px; color: #9aa0aa; text-transform: uppercase; }
#bubble .bv { font: 700 26px/1.1 var(--ui); color: #fff; font-variant-numeric: tabular-nums; margin-top: 3px; white-space: nowrap; }
#bubble .bn { font: 500 10px/1.2 var(--ui); color: var(--accent); margin-top: 1px; }
#bubble .bar { position: relative; height: 6px; background: #24262b; border-radius: 3px; margin-top: 7px; overflow: hidden; }
#bubble .bar i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
#bubble .bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; left: 50%; background: #6b7078; }

/* ---------- modal (library / help) */
#modal { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 10px; }
#modal .panel { width: min(860px, 100%); height: min(560px, 100%); background: #0a0c10; border: 1px solid #2a2f38; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
#modal .mh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #1d222a; flex-wrap: wrap; }
#modal .mh h2 { margin: 0 auto 0 0; font: 700 18px/1 var(--label); letter-spacing: 1.5px; color: #fff; text-transform: uppercase; }
#modal input[type=search] { font: 500 14px/1 var(--ui); color: #fff; background: #13161c; border: 1px solid #2a303a; border-radius: 8px; padding: 8px 10px; min-width: 0; flex: 1 1 180px; max-width: 280px; }
#modal .btn { font: 600 13px/1 var(--ui); letter-spacing: .4px; color: #fff; background: #2a2f38; border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; min-height: 34px; white-space: nowrap; }
#modal .btn.pri { background: var(--accent); color: #1a0d00; }
#modal .btn:focus-visible, #modal input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mlist { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.mlist .row { display: grid; grid-template-columns: 40px minmax(0,1fr) 54px 36px 46px auto; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #141820; font: 500 14px/1.2 var(--ui); }
.mlist .row.sel { background: #13213d; }
.mlist .art { width: 40px; height: 40px; border-radius: 4px; background: #1a1d24 center/cover; }
.mlist .ti { overflow: hidden; }
.mlist .ti b { display: block; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mlist .ti small { color: #858d99; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.mlist .bpm { color: #ffb24a; font-variant-numeric: tabular-nums; text-align: right; }
.mlist .key { color: #7fd0ff; text-align: center; }
.mlist .tm { color: #8a919c; font-variant-numeric: tabular-nums; }
.mlist .acts { display: flex; gap: 6px; }
.mlist .acts button { font: 700 12px/1 var(--ui); border: 0; border-radius: 7px; min-width: 40px; min-height: 34px; padding: 0 9px; cursor: pointer; color: #fff; background: #283044; }
.mlist .acts button.l1, .mlist .acts button.l2 { background: #1d3d82; }
.mlist .acts button.tg.on { color: #ffd21c; }
.mlist .acts button:focus-visible { outline: 2px solid var(--accent); }
