<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Club app icon</title>
  <desc id="desc">A dark rounded-square app icon with two opposing C arcs around a central cue dot.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142C4B"/>
      <stop offset="1" stop-color="#060C16"/>
    </linearGradient>
    <linearGradient id="blue" x1="270" y1="220" x2="755" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4CEBFF"/>
      <stop offset="1" stop-color="#5275FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="340" fill="#0A1626" stroke="#25425F" stroke-width="8"/>
  <circle cx="512" cy="512" r="286" fill="none" stroke="#1D3854" stroke-width="3"/>
  <g filter="url(#glow)">
    <!-- Left and right C make an open, spinning deck; the gaps keep them visibly independent. -->
    <!-- The inner ends are squared and intentionally held apart, like twin deck platters. -->
    <path d="M472 315A210 210 0 1 0 472 709" fill="none" stroke="#F5FCFF" stroke-width="72" stroke-linecap="butt"/>
    <path d="M552 315A210 210 0 1 1 552 709" fill="none" stroke="url(#blue)" stroke-width="72" stroke-linecap="butt"/>
  </g>
  <circle cx="512" cy="512" r="52" fill="#F5FCFF"/>
  <circle cx="512" cy="512" r="20" fill="#091423"/>
  <circle cx="512" cy="512" r="7" fill="#4CEBFF"/>
  <g fill="#80F1FF"><circle cx="512" cy="159" r="8"/><circle cx="512" cy="865" r="8"/></g>
</svg>
