<style>
/* hero: a reel of the app in action, four clips that take turns */
#hero { position: relative; height: calc(100svh - var(--head)); min-height: 560px; max-height: 920px; overflow: hidden; background: #03050a; }
#hero .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
#hero .slide.on { opacity: 1; }
#hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; transform: scale(1.3); transform-origin: 50% 82%; }   /* zoomed in and anchored low, so the dark ceiling doesn't sit under the header */
#hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(3,5,10,.55) 0%, rgba(3,5,10,0) 28%, rgba(3,5,10,0) 45%, rgba(3,5,10,.88) 100%), linear-gradient(90deg, rgba(3,5,10,.55) 0%, rgba(3,5,10,0) 55%); }
#hcopy { position: absolute; z-index: 2; left: clamp(16px, 5vw, 64px); right: clamp(16px, 5vw, 64px); bottom: clamp(70px, 11vh, 120px); max-width: 980px; }
#hcopy .eyebrow { margin: 0 0 14px; }
#tag { margin: 0 0 14px; font: 700 clamp(20px, 3.5vw, 44px)/1.14 var(--font); letter-spacing: .06em; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
#tag span { color: var(--blue); }
#hline { margin: 0 0 26px; max-width: 52ch; color: #d3e2f0; font-size: clamp(15px, 1.7vw, 19px); text-shadow: 0 1px 14px rgba(0,0,0,.7); min-height: 2.9em; }
#below { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#below a { font: 700 11px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; text-decoration: none; padding: 14px 22px; border-radius: 999px; color: var(--ink); border: 1px solid rgba(255,255,255,.34); background: rgba(3,5,10,.35); backdrop-filter: blur(6px); }
#below a:hover { border-color: var(--blue); color: var(--blue); }
#below a.main { color: #04121a; background: var(--blue); border-color: var(--blue); box-shadow: 0 0 26px rgba(76,235,255,.45); } #below a.main:hover { color: #04121a; filter: brightness(1.08); }
#dots { position: absolute; z-index: 2; left: clamp(16px, 5vw, 64px); right: clamp(16px, 5vw, 64px); bottom: clamp(26px, 4.5vh, 44px); display: flex; gap: 8px; max-width: 760px; }
#dots button { flex: 1; height: 26px; background: transparent; border: 0; padding: 11px 0; cursor: pointer; position: relative; }
#dots button::before, #dots button i { content: ''; position: absolute; left: 0; right: 0; top: 11px; height: 3px; border-radius: 2px; }
#dots button::before { background: rgba(255,255,255,.28); }
#dots button i { right: auto; width: 0; background: var(--blue); }
#dots button.on i { animation: fill var(--slide, 9s) linear forwards; }
@keyframes fill { to { width: 100%; } }
@media (prefers-reduced-motion: reduce) { #dots button.on i { animation: none; width: 100%; } }
#hero .still { display: none; }

/* live now */
#live { padding: 54px 0 80px; border-top: 1px solid var(--line); background: radial-gradient(ellipse at 50% 0%, rgba(76,235,255,.06), transparent 60%); }
#live .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
#live h2 { margin: 0; font: 700 clamp(18px, 2.6vw, 26px)/1.2 var(--font); letter-spacing: .1em; }
#live h2 .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff3b5c; margin-right: 12px; box-shadow: 0 0 12px #ff3b5c; vertical-align: 1px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
#live .sub { color: var(--dim); font-size: 15px; margin: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.lcard { position: relative; display: flex; flex-direction: column; gap: 5px; text-align: left; padding: 0 0 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; font-family: var(--ui); overflow: hidden; transition: transform .15s, border-color .15s, box-shadow .15s; }
.lcard:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--blue); box-shadow: 0 10px 34px rgba(76,235,255,.14); }
.lcard:disabled { opacity: .6; cursor: default; }
.lthumb { display: block; aspect-ratio: 16 / 9; background-size: cover; background-position: center; }
.lcard > :not(.lthumb) { margin: 0 14px; }
.lbadge { position: absolute; top: 10px; left: 10px; margin: 0 !important; font: 700 10px var(--font); letter-spacing: .14em; padding: 5px 8px; border-radius: 6px; background: #ff3b5c; color: #fff; }
.lcard.full .lbadge { background: #3a4658; }
.lcard .lav { width: 34px; height: 34px; margin-top: -17px !important; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font); color: #07101a; border: 3px solid var(--card); position: relative; }
.ltitle { font: 700 16px/1.25 var(--ui); } .lname { font: 500 13px var(--ui); font-style: normal; color: #8fe9ff; }
.lmeta { font: 500 13px var(--ui); color: #9fb2c6; } .lfoot { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; font: 600 12px var(--ui); color: var(--dim); }
.lempty { grid-column: 1 / -1; text-align: center; padding: 40px 16px; border: 1px dashed #26384c; border-radius: 16px; color: var(--dim); }
.lempty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; } .lempty .btn { margin-top: 18px; }

</style>

<body>
<section id="hero" aria-label="Club Cloud">
  <div class="slide on" data-h="Step inside a real nightclub. A 3D club, a crowd that reacts to your mix, and a robot DJ on the decks around the clock.">
    <video muted playsinline preload="auto" poster="hero/clubwide.jpg" aria-hidden="true"><source src="hero/clubwide.mp4" type="video/mp4"></video></div>
  <div class="slide" data-h="Club Cloud's 24/7 rooms are always on. Pick a genre, walk in, and the robot DJ plays while the club dances around you.">
    <video muted playsinline preload="none" poster="hero/robotdj.jpg" aria-hidden="true"><source src="hero/robotdj.mp4" type="video/mp4"></video></div>
  <div class="slide" data-h="The crowd reads your mix. Blend it clean and they go wild, drop it on the beat and the CO2 fires, trainwreck it and they boo.">
    <video muted playsinline preload="none" poster="hero/crowdlow.jpg" aria-hidden="true"><source src="hero/crowdlow.mp4" type="video/mp4"></video></div>
  <div class="slide" data-h="A light show that locks to the beat. Lasers, moving heads, blinders and light towers, all following the music you play.">
    <video muted playsinline preload="none" poster="hero/lights.jpg" aria-hidden="true"><source src="hero/lights.mp4" type="video/mp4"></video></div>
  <div id="hcopy">
    <h1 id="tag">WORLD'S FIRST DJ CLUB<br>SIMULATOR <span>AND</span> LIVE STREAM</h1>
    <p id="hline"></p>
    <nav id="below" aria-label="Quick links"><a class="main" href="/app">Enter the club</a><a href="#live">Watch live</a><a href="/pricing">Pricing</a></nav>
  </div>
  <div id="dots" role="tablist" aria-label="Highlights"><button type="button" role="tab" aria-label="The club"><i></i></button><button type="button" role="tab" aria-label="24/7 rooms"><i></i></button><button type="button" role="tab" aria-label="The crowd"><i></i></button><button type="button" role="tab" aria-label="The lights"><i></i></button></div>
</section>

<section id="live"><div class="wrap">
  <div class="head"><h2><span class="dot" aria-hidden="true"></span>LIVE NOW</h2><p class="sub">Every stream is free to watch. After 5 minutes you’ll just need to sign up with your email to keep watching.</p></div>
  <div class="lgrid" id="liveGrid" aria-live="polite"><div class="lempty"><b>Checking who's on air…</b></div></div>
</div></section>
