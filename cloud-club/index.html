<title>Club Cloud</title>
<meta name="description" content="Club Cloud: the world's first virtual DJ club. Watch live sets free, play the decks, or go live.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* hero: a reel of the app in action, four clips that take turns */
#hero { position: relative; height: calc(100svh - var(--head)); min-height: 560px; max-height: 940px; overflow: hidden; background: #050505; }
#hero .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
#hero .slide.on { opacity: 1; }
#hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; transform: scale(1.3); transform-origin: 50% 82%; }   /* zoomed in and anchored low, so the dark ceiling doesn't sit under the header */
#hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(5,5,5,.5) 0%, rgba(5,5,5,0) 26%, rgba(5,5,5,0) 38%, rgba(5,5,5,.92) 100%), linear-gradient(90deg, rgba(5,5,5,.6) 0%, rgba(5,5,5,0) 60%); }
#hcopy { position: absolute; z-index: 2; left: clamp(20px, 5vw, 72px); right: clamp(20px, 5vw, 72px); bottom: clamp(76px, 12vh, 132px); max-width: 960px; }
#tag { margin: 0 0 20px; font: 600 clamp(38px, 6.6vw, 88px)/1.0 var(--font); letter-spacing: -.04em; color: #fff; text-wrap: balance; max-width: 15ch; }
#tag span { color: inherit; }
#hline { margin: 0 0 30px; max-width: 50ch; color: rgba(244,244,242,.78); font-size: clamp(16px, 1.6vw, 19px); line-height: 1.55; min-height: 3.1em; }
#below { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#below a { font: 600 14px/1 var(--ui); text-decoration: none; padding: 14px 20px; border-radius: var(--r); color: var(--ink); border: 1px solid rgba(255,255,255,.28); background: rgba(5,5,5,.3); backdrop-filter: blur(8px); transition: background .15s, border-color .15s; }
#below a:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }
#below a.main { color: #050505; background: var(--ink); border-color: var(--ink); } #below a.main:hover { background: #fff; border-color: #fff; }
#dots { position: absolute; z-index: 2; left: clamp(20px, 5vw, 72px); right: clamp(20px, 5vw, 72px); bottom: clamp(28px, 4.5vh, 48px); display: flex; gap: 8px; max-width: 560px; }
#dots button { flex: 1; height: 24px; background: transparent; border: 0; padding: 11px 0; cursor: pointer; position: relative; }
#dots button::before, #dots button i { content: ''; position: absolute; left: 0; right: 0; top: 11px; height: 2px; border-radius: 1px; }
#dots button::before { background: rgba(255,255,255,.22); }
#dots button i { right: auto; width: 0; background: #fff; }
#dots button.on i { animation: fill var(--slide, 9s) linear forwards; }
@keyframes fill { to { width: 100%; } }
@media (prefers-reduced-motion: reduce) { #dots button.on i { animation: none; width: 100%; } }
#hero .still { display: none; }

/* live now */
#live { padding: clamp(56px, 8vw, 104px) 0 clamp(72px, 10vw, 128px); }
#live .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px 40px; flex-wrap: wrap; margin-bottom: 28px; }
#live h2 { margin: 0; font: 600 clamp(26px, 3.2vw, 38px)/1.1 var(--font); letter-spacing: -.025em; display: flex; align-items: center; gap: 12px; }
#live h2 .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff4d5e; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#live .sub { color: var(--dim); font-size: 14.5px; margin: 0; max-width: 46ch; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.lcard { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 0 0 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-family: var(--ui); overflow: hidden; transition: border-color .2s, transform .2s; }
.lcard:hover:not(:disabled) { border-color: rgba(255,255,255,.3); }
.lcard:disabled { opacity: .55; cursor: default; }
.lthumb { display: block; aspect-ratio: 16 / 9; background-size: cover; background-position: center; transition: transform .6s ease; }
.lcard:hover:not(:disabled) .lthumb { transform: scale(1.03); }
.lcard > :not(.lthumb) { margin: 0 14px; }
.lbadge { position: absolute; top: 12px; left: 12px; margin: 0 !important; font: 600 11px/1 var(--ui); letter-spacing: .02em; padding: 6px 8px; border-radius: 6px; background: rgba(5,5,5,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; display: inline-flex; align-items: center; gap: 6px; }
.lbadge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff4d5e; }
.lcard.full .lbadge::before { background: #6b7077; }
.lcard.house { aspect-ratio: 16 / 9; padding: 0; gap: 0; } .lcard.house .lthumb { position: absolute; inset: 0; aspect-ratio: auto; }
.lcard.house .lover { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 !important; display: flex; flex-direction: column; gap: 3px; padding: 56px 20px 18px; background: linear-gradient(to top, rgba(5,5,5,.94), rgba(5,5,5,.5) 55%, transparent); }
.lcard.house .lover > * { margin: 0 !important; }
.lcard.house .ltitle { font: 600 clamp(18px, 2vw, 24px)/1.2 var(--font); letter-spacing: -.02em; }
@media (min-width: 640px) { .lcard.house { grid-column: span 2; } }
.lviews { position: absolute; top: 12px; right: 12px; margin: 0 !important; display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--ui); padding: 6px 8px; border-radius: 6px; background: rgba(5,5,5,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; }
.lcard .lav { width: 32px; height: 32px; margin-top: -16px !important; border-radius: 50%; display: grid; place-items: center; font: 600 14px var(--font); color: #050505; border: 3px solid var(--card); position: relative; }
.ltitle { font: 600 16px/1.3 var(--font); letter-spacing: -.01em; } .lname { font: 400 13px var(--ui); font-style: normal; color: var(--dim); }
.lmeta { font: 400 13px var(--ui); color: var(--dim); } .lfoot { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; font: 500 12.5px var(--ui); color: var(--dim); }
.lempty { grid-column: 1 / -1; text-align: center; padding: 48px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--dim); }
.lempty b { display: block; color: var(--ink); font: 600 17px var(--font); margin-bottom: 6px; } .lempty .btn { margin-top: 18px; }
</style>

<meta property="og:type" content="website"><meta property="og:site_name" content="Club Cloud"><meta property="og:url" content="https://clubcloud.vip/">
<meta property="og:title" content="Club Cloud"><meta property="og:description" content="The world's first virtual DJ club. Watch live sets free, play the decks, or go live.">
<meta property="og:image" content="https://clubcloud.vip/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="The Club Cloud logo">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Club Cloud"><meta name="twitter:description" content="The world's first virtual DJ club. Watch live sets free, play the decks, or go live."><meta name="twitter:image" content="https://clubcloud.vip/og-image.png">

<body>
<section id="hero" aria-label="Club Cloud">
  <div class="slide on" data-h="Step inside a real nightclub. A 3D club, a crowd that reacts to your mix, and a robot DJ on the decks around the clock.">
    <video muted playsinline preload="auto" poster="hero/clubwide.jpg" aria-hidden="true"><source src="hero/clubwide.mp4" type="video/mp4"></video></div>
  <div class="slide" data-h="Club Cloud's 24/7 rooms are always on. Pick a genre, walk in, and the robot DJ plays while the club dances around you.">
    <video muted playsinline preload="none" poster="hero/robotdj.jpg" aria-hidden="true"><source src="hero/robotdj.mp4" type="video/mp4"></video></div>
  <div class="slide" data-h="The crowd reads your mix. Blend it clean and they go wild, drop it on the beat and the CO2 fires, trainwreck it and they boo.">
    <video muted playsinline preload="none" poster="hero/crowdlow.jpg" aria-hidden="true"><source src="hero/crowdlow.mp4" type="video/mp4"></video></div>
  <div class="slide" data-h="A light show that locks to the beat. Lasers, moving heads, blinders and light towers, all following the music you play.">
    <video muted playsinline preload="none" poster="hero/lights.jpg" aria-hidden="true"><source src="hero/lights.mp4" type="video/mp4"></video></div>
  <div id="hcopy">
    <h1 id="tag">The world’s first DJ club simulator and live stream</h1>
    <p id="hline"></p>
    <nav id="below" aria-label="Quick links"><a class="main" href="/app">Enter the club</a><a href="#live">Watch live</a><a href="/pricing">Pricing</a></nav>
  </div>
  <div id="dots" role="tablist" aria-label="Highlights"><button type="button" role="tab" aria-label="The club"><i></i></button><button type="button" role="tab" aria-label="24/7 rooms"><i></i></button><button type="button" role="tab" aria-label="The crowd"><i></i></button><button type="button" role="tab" aria-label="The lights"><i></i></button></div>
</section>

<section id="live"><div class="wrap">
  <div class="head"><h2><span class="dot" aria-hidden="true"></span>Live now</h2><p class="sub">Every stream is free to watch. After 5 minutes you’ll just need to sign up with your email to keep watching.</p></div>
  <div class="lgrid" id="liveGrid" aria-live="polite"><div class="lempty"><b>Checking who's on air…</b></div></div>
</div></section>

<script type="module" src="site.js?v=6"></script>
<script type="module" src="hero.js?v=1"></script>

</body>
</html>
