<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Cloud</title>
<meta name="description" content="Club Cloud: the world's first virtual DJ club. Sign up for early access.">
<meta name="theme-color" content="#03050a">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Club Cloud">
<meta property="og:description" content="The world's first virtual DJ club. Sign up for early access.">
<meta property="og:image" content="logo-512.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root { --bg: #03050a; --ink: #e9f6ff; --dim: #7f93a8; --blue: #4cebff; --font: 'Syncopate', 'Avenir Next', 'Helvetica Neue', sans-serif; --ui: 'Space Grotesk', 'Helvetica Neue', sans-serif; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* the sign-up sits in the middle of the LED screen; --cx/--cy/--d are set from the screen's place on the page */
#signup { position: fixed; left: var(--cx, 50%); top: var(--cy, 45%); translate: -50% -50%; width: calc(var(--d, 300px) * .62); display: flex; justify-content: center; }
#signup button, #signup input { font: 700 clamp(12px, calc(var(--d, 300px) * .036), 17px)/1 var(--font); letter-spacing: .14em; border-radius: 999px; }
.su-open { color: #04121a; background: var(--blue); border: 0; padding: 1.05em 2em; cursor: pointer; box-shadow: 0 0 28px rgba(76,235,255,.55); transition: transform .15s, box-shadow .15s; }
.su-open:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(76,235,255,.8); }
.su-form { display: flex; align-items: center; width: 100%; background: rgba(3,8,14,.55); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 5px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: grow .3s ease-out both; }
@keyframes grow { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
#signup .su-form input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; padding: .9em 1.1em; outline: none;
  font: 500 clamp(14px, calc(var(--d, 300px) * .04), 18px)/1 var(--ui); letter-spacing: .01em; }
.su-form input::placeholder { color: rgba(220,236,248,.55); }
.su-form button { color: #04121a; background: var(--blue); border: 0; padding: 1em 1.4em; cursor: pointer; white-space: nowrap; }
.su-form button:disabled { opacity: .6; cursor: default; }
.su-msg { text-align: center; font: 700 clamp(12px, calc(var(--d, 300px) * .04), 19px)/1.4 var(--font); letter-spacing: .12em; color: #fff; text-shadow: 0 0 18px rgba(76,235,255,.9); }
.su-msg small { display: block; font: 600 .62em/1.4 var(--ui); letter-spacing: .04em; color: #bfe9ff; text-shadow: none; margin-top: .4em; }
.su-err { position: absolute; top: calc(100% + 10px); left: 50%; translate: -50% 0; white-space: nowrap; text-align: center; font: 600 14px/1.3 var(--ui); color: #ffd0d6; background: rgba(40,4,10,.82); border: 1px solid rgba(255,120,140,.45); border-radius: 999px; padding: 6px 12px; }

/* under the screen, small */
#below { position: fixed; left: 0; right: 0; top: var(--below, 82%); display: flex; justify-content: center; align-items: center; gap: 18px; flex-wrap: wrap; padding: 0 16px; }
#below a, #below button { font: 700 11px/1 var(--font); letter-spacing: .2em; text-transform: uppercase; color: var(--ink); text-decoration: none; background: none; border: 0; padding: 10px 4px; cursor: pointer; opacity: .85; transition: opacity .15s, color .15s; }
#below a:hover, #below button:hover { opacity: 1; color: var(--blue); }
#below .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--dim); }
#below .invite { border: 1px solid rgba(76,235,255,.5); border-radius: 999px; padding: 10px 16px; color: var(--blue); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

/* early access */
#gate { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#gate .card { width: min(380px, 100%); background: #070d16; border: 1px solid #1d3247; border-radius: 18px; padding: 26px 22px 20px; box-shadow: 0 30px 80px rgba(0,0,0,.7); position: relative; animation: grow .25s both; }
#gate h2 { margin: 0 0 8px; font: 700 17px/1.2 var(--font); letter-spacing: .14em; }
#gate p { margin: 0 0 18px; font: 500 15px/1.45 var(--ui); color: #9fb3c6; }
#gate form { display: flex; gap: 8px; }
#gate input { flex: 1; min-width: 0; font: 600 16px/1 var(--ui); color: #fff; background: #0d1826; border: 1px solid #25405a; border-radius: 10px; padding: 12px 12px; outline: none; }
#gate input:focus { border-color: var(--blue); }
#gate form button { font: 700 12px/1 var(--font); letter-spacing: .14em; color: #04121a; background: var(--blue); border: 0; border-radius: 10px; padding: 0 16px; cursor: pointer; }
#gate form button:disabled { opacity: .6; }
#gate .err { min-height: 20px; margin-top: 8px; font: 600 14px/1.3 var(--ui); color: #ff9aa6; }
#gate .req { display: inline-block; margin-top: 6px; font: 600 15px/1.3 var(--ui); color: var(--blue); }
#gate .x { position: absolute; right: 10px; top: 8px; width: 34px; height: 34px; border: 0; background: none; color: #8aa0b4; font-size: 22px; cursor: pointer; border-radius: 8px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .su-form, #gate .card { animation: none; } }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>

<div id="signup">
  <button class="su-open" type="button">SIGN UP</button>
  <form class="su-form" hidden novalidate>
    <input type="email" name="email" placeholder="Email address" autocomplete="email" inputmode="email" required aria-label="Email address">
    <button type="submit">SIGN UP</button>
  </form>
  <div class="su-msg" hidden role="status"></div>
  <div class="su-err" hidden role="alert"></div>
</div>

<nav id="below">
  <a href="https://www.instagram.com/tommeofficial/" target="_blank" rel="noopener">Watch Trailer</a>
  <span class="dot" aria-hidden="true"></span>
  <button class="invite" type="button">Early Invite</button>
</nav>

<div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-t">
  <div class="card">
    <button class="x" type="button" aria-label="Close">×</button>
    <h2 id="gate-t">EARLY ACCESS</h2>
    <p>Enter your invite password to get into Club Cloud.</p>
    <form>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button type="submit">ENTER</button>
    </form>
    <div class="err" role="alert"></div>
    <a class="req" href="https://www.instagram.com/tommeofficial/" target="_blank" rel="noopener">Request early access</a>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/" } }</script>
<script type="module" src="landing.js?v=3"></script>
</body>
</html>
