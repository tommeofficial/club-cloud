<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Cloud</title>
<meta name="description" content="Club Cloud: the world's first virtual DJ club. Watch live sets free, play the decks, or go live.">
<meta name="theme-color" content="#03050a">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Club Cloud">
<meta property="og:description" content="The world's first virtual DJ club. Watch live sets free, play the decks, or go live.">
<meta property="og:image" content="logo-512.png">
<meta name="twitter:card" content="summary">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.min.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.core.min.js" crossorigin>
<link rel="modulepreload" href="screen.js?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css?v=4">
<style>
/* hero: the LED screen, with the sign-in button in the middle of it; --cx/--cy/--d come from landing.js */
#hero { position: relative; height: calc(100svh - var(--head)); min-height: 560px; max-height: 920px; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .9s ease-out; }
#cv.on { opacity: 1; }
#signup { position: absolute; left: var(--cx, 50%); top: var(--cy, 45%); translate: -50% -50%; display: flex; justify-content: center; }
.su-open { font: 700 clamp(12px, calc(var(--d, 300px) * .036), 17px)/1 var(--font); letter-spacing: .14em; border-radius: 999px; color: #04121a; background: var(--blue); border: 0; padding: 1.05em 2em; cursor: pointer; box-shadow: 0 0 28px rgba(76,235,255,.55); transition: transform .15s, box-shadow .15s; white-space: nowrap; }
.su-open:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(76,235,255,.8); }
#tag { position: absolute; left: 16px; right: 16px; top: var(--tag, 78%); margin: 0; text-align: center; font: 700 var(--tagfs, 18px)/1.35 var(--font); letter-spacing: .1em; color: #fff; }
#tag span { color: var(--blue); }
#below { position: absolute; left: 0; right: 0; top: var(--below, 82%); display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 16px; }
#below a { font: 700 11px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; text-decoration: none; padding: 13px 20px; border-radius: 999px; color: var(--ink); border: 1px solid rgba(255,255,255,.3); }
#below a:hover { border-color: var(--blue); color: var(--blue); }
#below a.main { color: var(--blue); border-color: rgba(76,235,255,.55); }

/* live now */
#live { padding: 54px 0 80px; border-top: 1px solid var(--line); background: radial-gradient(ellipse at 50% 0%, rgba(76,235,255,.06), transparent 60%); }
#live .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
#live h2 { margin: 0; font: 700 clamp(18px, 2.6vw, 26px)/1.2 var(--font); letter-spacing: .1em; }
#live h2 .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ff3b5c; margin-right: 12px; box-shadow: 0 0 12px #ff3b5c; vertical-align: 1px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
#live .sub { color: var(--dim); font-size: 15px; margin: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.lcard { position: relative; display: flex; flex-direction: column; gap: 5px; text-align: left; padding: 0 0 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; font-family: var(--ui); overflow: hidden; transition: transform .15s, border-color .15s, box-shadow .15s; }
.lcard:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--blue); box-shadow: 0 10px 34px rgba(76,235,255,.14); }
.lcard:disabled { opacity: .6; cursor: default; }
.lthumb { display: block; aspect-ratio: 16 / 9; background-size: cover; background-position: center; }
.lcard > :not(.lthumb) { margin: 0 14px; }
.lbadge { position: absolute; top: 10px; left: 10px; margin: 0 !important; font: 700 10px var(--font); letter-spacing: .14em; padding: 5px 8px; border-radius: 6px; background: #ff3b5c; color: #fff; }
.lcard.full .lbadge { background: #3a4658; }
.lcard .lav { width: 34px; height: 34px; margin-top: -17px !important; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font); color: #07101a; border: 3px solid var(--card); position: relative; }
.ltitle { font: 700 16px/1.25 var(--ui); } .lname { font: 500 13px var(--ui); font-style: normal; color: #8fe9ff; }
.lmeta { font: 500 13px var(--ui); color: #9fb2c6; } .lfoot { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; font: 600 12px var(--ui); color: var(--dim); }
.lempty { grid-column: 1 / -1; text-align: center; padding: 40px 16px; border: 1px dashed #26384c; border-radius: 16px; color: var(--dim); }
.lempty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; } .lempty .btn { margin-top: 18px; }

</style>
</head>
<body>
<section id="hero" aria-label="Club Cloud">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="signup"><button class="su-open" type="button" id="heroCta">SIGN IN</button></div>
  <h1 id="tag">WORLD'S FIRST DJ CLUB<br>SIMULATOR <span>AND</span> LIVE STREAM</h1>
  <nav id="below" aria-label="Quick links"><a class="main" href="#live">Watch live</a><a href="/app">Play the decks</a><a href="/pricing">Pricing</a></nav>
</section>

<section id="live"><div class="wrap">
  <div class="head"><h2><span class="dot" aria-hidden="true"></span>LIVE NOW</h2><p class="sub">Watch any stream free. Sign in to join one.</p></div>
  <div class="lgrid" id="liveGrid" aria-live="polite"><div class="lempty"><b>Checking who's on air…</b></div></div>
</div></section>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/" } }</script>
<script type="module" src="site.js?v=4"></script>
<script type="module" src="landing.js?v=11"></script>
<script type="module" src="home-grid.js?v=2"></script>
</body>
</html>
